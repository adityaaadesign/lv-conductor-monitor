# Render Blueprint – ONE service: the LIVE backend (Express API + SQLite on a persistent disk).
# The dashboard is hosted on Vercel (vercel.json). DEMO mode runs on the laptop: npm run sim.
#
# This is a PAID service (a persistent disk needs a paid instance). Check current prices on
# Render's pricing page before you click Deploy. Steps: docs/DEPLOYMENT.md.
services:
  - type: web
    name: lv-monitor-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci
    startCommand: node --disable-warning=ExperimentalWarning server/index.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_MODE
        value: live
      - key: DATA_DIR
        value: /var/data
      - key: NODE_VERSION
        value: "24"
      - key: DEVICE_KEYS          # CTRL-01=<your key> – entered in the Render dashboard, never committed
        sync: false
      - key: ALLOWED_ORIGINS      # your Vercel address, e.g. https://lv-conductor-monitor.vercel.app
        sync: false
    disk:
      name: lv-monitor-data
      mountPath: /var/data
      sizeGB: 1
